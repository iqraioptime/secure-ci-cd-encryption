name: Run Encryption Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: ubuntu-latest

    env:
      AES_KEY: ${{ secrets.AES_KEY }}
      PAILLIER_PUBLIC_KEY: ${{ secrets.PAILLIER_PUBLIC_KEY }}
      PAILLIER_PRIVATE_KEY: ${{ secrets.PAILLIER_PRIVATE_KEY }}

    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib psutil cryptography phe

    - name: 📁 List files (debug)
      run: ls -la

    - name: 🚀 Run encryption script
      run: python script.py
